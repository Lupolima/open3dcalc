      <!-- Spool -->
      <circle cx="16" cy="16" r="12" stroke="#6b7280" stroke-width="2" fill="none"/>
      <circle cx="16" cy="16" r="6" fill="#374151"/>
    </g>
  </g>
  <text x="256" y="400" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold">3D</text>
