<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <!-- Background -->
  <rect width="192" height="192" fill="#3b82f6" rx="45"/>
  
  <!-- 3D Printer Icon -->
  <g transform="translate(48, 48)">
    <!-- Printer Frame -->
    <rect x="10" y="15" width="80" height="65" fill="none" stroke="#ffffff" stroke-width="3" rx="3"/>
    
    <!-- Build Plate -->
    <rect x="15" y="50" width="70" height="25" fill="#60a5fa" stroke="#ffffff" stroke-width="2" rx="2"/>
    
    <!-- Nozzle -->
    <circle cx="50" cy="40" r="4" fill="#fbbf24"/>
    <line x1="50" y1="44" x2="50" y2="50" stroke="#fbbf24" stroke-width="2"/>
    
    <!-- Z-axis -->
    <line x1="25" y1="10" x2="25" y2="85" stroke="#ffffff" stroke-width="2"/>
    <line x1="75" y1="10" x2="75" y2="85" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Control Panel (small detail) -->
    <rect x="15" y="82" width="70" height="8" fill="#60a5fa" stroke="#ffffff" stroke-width="1.5" rx="1"/>
  </g>
  
  <!-- Badge circle -->
  <circle cx="155" cy="155" r="25" fill="#10b981"/>
  <text x="155" y="162" text-anchor="middle" font-size="32" font-weight="bold" fill="#ffffff">3D</text>
</svg>