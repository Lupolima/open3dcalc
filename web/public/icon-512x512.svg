<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background -->
  <rect width="512" height="512" fill="#3b82f6" rx="120"/>
  
  <!-- 3D Printer Icon (scaled up) -->
  <g transform="translate(128, 128)">
    <!-- Printer Frame -->
    <rect x="30" y="40" width="210" height="170" fill="none" stroke="#ffffff" stroke-width="8" rx="10"/>
    
    <!-- Build Plate -->
    <rect x="45" y="130" width="180" height="65" fill="#60a5fa" stroke="#ffffff" stroke-width="5" rx="5"/>
    
    <!-- Nozzle -->
    <circle cx="135" cy="105" r="12" fill="#fbbf24"/>
    <line x1="135" y1="120" x2="135" y2="130" stroke="#fbbf24" stroke-width="6"/>
    
    <!-- Z-axis Rails -->
    <line x1="65" y1="25" x2="65" y2="220" stroke="#ffffff" stroke-width="6"/>
    <line x1="200" y1="25" x2="200" y2="220" stroke="#ffffff" stroke-width="6"/>
    
    <!-- Filament Spool (left top) -->
    <circle cx="50" cy="50" r="18" fill="none" stroke="#ef4444" stroke-width="4"/>
    <circle cx="50" cy="50" r="10" fill="#ef4444" opacity="0.3"/>
    
    <!-- Control Panel -->
    <rect x="45" y="210" width="180" height="20" fill="#60a5fa" stroke="#ffffff" stroke-width="3" rx="3"/>
    <circle cx="70" cy="220" r="3" fill="#ffffff"/>
    <circle cx="90" cy="220" r="3" fill="#ffffff"/>
    <circle cx="110" cy="220" r="3" fill="#ffffff"/>
  </g>
  
  <!-- Badge circle -->
  <circle cx="410" cy="410" r="70" fill="#10b981"/>
  <text x="410" y="435" text-anchor="middle" font-size="90" font-weight="bold" fill="#ffffff">3D</text>
</svg>