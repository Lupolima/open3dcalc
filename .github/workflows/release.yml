name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Tipo de bump (auto = detecta dos commits)'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  release-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Setup Wine (Windows cross-compile)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y wine64 wine32 2>/dev/null || true

      - name: Bump version with changelogen
        run: |
          if [ "${{ inputs.bump }}" = "auto" ]; then
            npx changelogen --bump
          else
            npx changelogen --bump --${{ inputs.bump }}
          fi

      - name: Build all targets
        run: |
          npm run build:all
          npm run build:electron

      - name: Electron-builder (Windows + Linux)
        run: npx electron-builder --win --linux --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit, tag and force push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION=v$(node -p "require('./package.json').version")
          git add package.json package-lock.json CHANGELOG.md 2>/dev/null || true
          git add -A
          git commit --no-verify -m "chore(release): $VERSION [skip ci]"
          git tag "$VERSION"
          git push --force --follow-tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=v$(node -p "require('./package.json').version")
          ARTIFACTS=""
          for f in dist-electron/Open3DCalc-*.exe dist-electron/Open3DCalc-*.AppImage dist-electron/Open3DCalc-*.dmg dist-electron/Open3DCalc-*.deb dist-electron/Open3DCalc-*.rpm dist-electron/Open3DCalc-*.zip; do
            if [ -f "$f" ]; then
              ARTIFACTS="$ARTIFACTS \"$f\""
            fi
          done
          if [ -n "$ARTIFACTS" ]; then
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target ${{ github.sha }} \
              $ARTIFACTS
          else
            gh release create "$VERSION" \
              --title "$VERSION" \
              --generate-notes \
              --target ${{ github.sha }}
          fi
