name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run -- --coverage
      - name: Upload coverage
        if: always() && hashFiles('coverage/') != ''
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  build-web:
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:web
      - name: SPA routing fix
        run: cp dist-web/index.web.html dist-web/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-web
      - id: deployment
        uses: actions/deploy-pages@v4

  build-desktop:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild native modules
        run: npm rebuild better-sqlite3 2>/dev/null || true
      - run: npm run build:desktop
      - name: Verify desktop build
        run: ls -la dist/
