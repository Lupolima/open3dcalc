name: 🐛 Bug Report
description: Reporte um bug para ajudar a melhorar o Open3DCalc
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Obrigado por reportar! Preencha os campos abaixo para ajudar a resolver o problema.
  - type: textarea
    id: descricao
    attributes:
      label: Descrição
      description: Descreva o bug de forma clara e objetiva
      placeholder: Ao clicar em "Calcular" com valores negativos...
    validations:
      required: true
  - type: textarea
    id: reproduzir
    attributes:
      label: Passos para Reproduzir
      description: Como reproduzir o comportamento
      placeholder: |
        1. Vá em 'Calculadora FDM'
        2. Insira peso = -100g
        3. Clique em 'Calcular'
        4. Veja o erro
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento Esperado
      description: O que deveria acontecer
      placeholder: O campo deveria aceitar apenas valores positivos
    validations:
      required: true
  - type: textarea
    id: ambiente
    attributes:
      label: Ambiente
      description: |
        - Navegador: [ex: Chrome 120]
        - OS: [ex: Windows 11]
        - Versão do App: [ex: 1.1.0]
      placeholder: |
        Navegador: Chrome 125
        OS: Windows 11
        Versão: 1.1.0
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: Se aplicável, adicione screenshots
    validations:
      required: false
